{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block acesso %}
<p class="centro mudo">Acesso restrito a profissionais autorizados do escritório.</p>
{% if erro %}<div class="aviso erro" role="alert">{{ erro }}</div>{% endif %}
<form class="formulario" method="post" action="/login" autocomplete="on">
  <input type="hidden" name="csrf" value="{{ pre }}">
  <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus autocomplete="username"></div>
  <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div>
  <button type="submit">Entrar</button>
</form>
<p class="rodape-acesso">Todas as ações são registradas em trilha de auditoria.</p>
{% endblock %}
