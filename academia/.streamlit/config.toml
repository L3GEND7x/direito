[theme]
primaryColor = "#F0364A"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1F"
textColor = "#F5F5F7"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# teto do servidor para qualquer upload (cópia de segurança .json no Perfil)
maxUploadSize = 20
# arquivos de static/ (ícones e manifesto para instalar o app na tela inicial) servidos em /app/static/
enableStaticServing = true
