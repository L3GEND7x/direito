services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadcob
      POSTGRES_USER: leadcob
      POSTGRES_PASSWORD: leadcob_dev
    volumes:
      - leadcob_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadcob -d leadcob"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    volumes:
      - leadcob_redis:/data
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
volumes:
  leadcob_pg:
  leadcob_redis:
