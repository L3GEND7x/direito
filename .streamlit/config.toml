[theme]
primaryColor = "#F0364A"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1F"
textColor = "#F5F5F7"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# teto do servidor para qualquer upload; o Personal IA ainda limita cada foto a 8 MB (Secrets: ia.max_foto_mb)
maxUploadSize = 20
